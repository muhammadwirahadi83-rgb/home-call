<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HOME CALL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    #status {
      margin: 20px auto;
      padding: 15px;
      max-width: 500px;
      background: #222;
      border-radius: 12px;
    }

    button {
      width: 80%;
      max-width: 350px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #00aaff;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.5;
    }

    .video-box {
      max-width: 600px;
      margin: 25px auto;
    }

    video {
      width: 100%;
      min-height: 200px;
      margin-bottom: 15px;
      background: black;
      border-radius: 12px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <h1>HOME CALL</h1>

  <div id="status">
    Menghubungkan...
  </div>

  <button id="callButton" disabled>
    PANGGIL
  </button>

  <div class="video-box">

    <h3>Kamera Saya</h3>
    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <h3>Kamera Penerima</h3>
    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

  </div>


  <script type="module">

    // =====================================================
    // FIREBASE
    // =====================================================

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      onSnapshot,
      updateDoc,
      arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyDyAki8b-cgy8UKD7lOJzYA-rvLXqHOmUw",

      authDomain:
        "home-call-947c8.firebaseapp.com",

      projectId:
        "home-call-947c8",

      storageBucket:
        "home-call-947c8.firebasestorage.app",

      messagingSenderId:
        "1070052309799",

      appId:
        "1:1070052309799:web:e35fff55d6c8b6625cc702",

      measurementId:
        "G-3CH3K7SKGP"
    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // =====================================================
    // ELEMENT
    // =====================================================

    const status =
      document.getElementById("status");

    const callButton =
      document.getElementById("callButton");

    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");


    // =====================================================
    // VARIABLE
    // =====================================================

    let currentUser = null;

    let peerConnection = null;

    let localStream = null;

    let currentCallId = null;

    let receiverCandidatesAdded =
      new Set();


    // =====================================================
    // WEBRTC
    // =====================================================

    const rtcConfiguration = {

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        }

      ]

    };


    // =====================================================
    // FIREBASE LOGIN
    // =====================================================

    status.textContent =
      "Menghubungkan ke Firebase...";


    signInAnonymously(auth)
      .catch((error) => {

        console.error(
          "Firebase login error:",
          error
        );

        status.textContent =
          "Firebase gagal: " +
          error.message;

      });


    onAuthStateChanged(
      auth,
      (user) => {

        if (!user) {
          return;
        }

        currentUser =
          user;

        status.textContent =
          "Siap melakukan panggilan";

        callButton.disabled =
          false;

      }
    );


    // =====================================================
    // TOMBOL PANGGIL
    // =====================================================

    callButton.addEventListener(
      "click",
      async () => {

        await startCall();

      }
    );


    // =====================================================
    // MULAI PANGGILAN
    // =====================================================

    async function startCall() {

      try {

        if (!currentUser) {

          status.textContent =
            "Firebase belum terhubung.";

          return;

        }


        callButton.disabled =
          true;


        status.textContent =
          "Meminta akses kamera dan mikrofon...";


        // =================================================
        // KAMERA + MICROPHONE
        // =================================================

        localStream =
          await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: true

          });


        localVideo.srcObject =
          localStream;


        status.textContent =
          "Kamera aktif. Membuat panggilan...";


        // =================================================
        // PEER CONNECTION
        // =================================================

        peerConnection =
          new RTCPeerConnection(
            rtcConfiguration
          );


        // =================================================
        // MASUKKAN KAMERA + AUDIO SENDIRI
        // =================================================

        for (
          const track
          of localStream.getTracks()
        ) {

          peerConnection.addTrack(
            track,
            localStream
          );

        }


        // =================================================
        // MENERIMA VIDEO DARI RECEIVER
        // =================================================

        peerConnection.ontrack =
          (event) => {

            console.log(
              "Remote stream diterima"
            );


            if (
              event.streams &&
              event.streams.length > 0
            ) {

              remoteVideo.srcObject =
                event.streams[0];

              status.textContent =
                "TERHUBUNG";

            }

          };


        // =================================================
        // ICE CANDIDATE CALLER
        // =================================================

        peerConnection.onicecandidate =
          async (event) => {

            if (
              !event.candidate
            ) {

              return;

            }


            if (!currentCallId) {

              return;

            }


            try {

              await updateDoc(

                doc(
                  db,
                  "calls",
                  currentCallId
                ),

                {

                  callerCandidates:
                    arrayUnion(
                      event.candidate.toJSON()
                    )

                }

              );

            } catch (error) {

              console.error(
                "ICE caller error:",
                error
              );

            }

          };


        // =================================================
        // BUAT OFFER
        // =================================================

        const offer =
          await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
          offer
        );


        // =================================================
        // SIMPAN PANGGILAN KE FIRESTORE
        // =================================================

        const callDocument =
          await addDoc(

            collection(
              db,
              "calls"
            ),

            {

              callerId:
                currentUser.uid,

              status:
                "menunggu",

              createdAtMs:
                Date.now(),

              offer: {

                type:
                  offer.type,

                sdp:
                  offer.sdp

              },

              answer:
                null,

              callerCandidates:
                [],

              receiverCandidates:
                []

            }

          );


        currentCallId =
          callDocument.id;


        console.log(
          "Call ID:",
          currentCallId
        );


        status.textContent =
          "Panggilan dibuat. Menunggu penerima...";


        // =================================================
        // PANTAU JAWABAN RECEIVER
        // =================================================

        onSnapshot(

          doc(
            db,
            "calls",
            currentCallId
          ),

          async (snapshot) => {

            const data =
              snapshot.data();


            if (!data) {

              return;

            }


            // =============================================
            // ANSWER
            // =============================================

            if (
              data.answer &&
              !peerConnection.currentRemoteDescription
            ) {

              console.log(
                "Answer dari penerima diterima"
              );


              try {

                await peerConnection.setRemoteDescription(

                  new RTCSessionDescription(
                    data.answer
                  )

                );


                status.textContent =
                  "Penerima menjawab. Menghubungkan...";


              } catch (error) {

                console.error(
                  "Answer error:",
                  error
                );

              }

            }


            // =============================================
            // ICE CANDIDATE RECEIVER
            // =============================================

            if (
              Array.isArray(
                data.receiverCandidates
              )
            ) {

              for (
                const candidateData
                of data.receiverCandidates
              ) {

                const key =
                  JSON.stringify(
                    candidateData
                  );


                if (
                  receiverCandidatesAdded.has(
                    key
                  )
                ) {

                  continue;

                }


                receiverCandidatesAdded.add(
                  key
                );


                try {

                  await peerConnection.addIceCandidate(

                    new RTCIceCandidate(
                      candidateData
                    )

                  );

                } catch (error) {

                  console.log(
                    "ICE receiver belum bisa ditambahkan:",
                    error
                  );

                }

              }

            }


            // =============================================
            // STATUS
            // =============================================

            if (
              data.status ===
              "terhubung"
            ) {

              status.textContent =
                "TERHUBUNG";

            }


            if (
              data.status ===
              "ditolak"
            ) {

              status.textContent =
                "Panggilan ditolak.";

              stopCall();

            }

          }

        );


      } catch (error) {

        console.error(
          "CALL ERROR:",
          error
        );


        callButton.disabled =
          false;


        if (
          error.name ===
          "NotAllowedError"
        ) {

          status.textContent =
            "Izin kamera/mikrofon ditolak.";

        } else {

          status.textContent =
            "Gagal: " +
            error.message;

        }

      }

    }


    // =====================================================
    // MATIKAN PANGGILAN
    // =====================================================

    function stopCall() {

      if (localStream) {

        localStream
          .getTracks()
          .forEach(
            (track) => track.stop()
          );

      }


      if (peerConnection) {

        peerConnection.close();

      }


      localVideo.srcObject =
        null;

      remoteVideo.srcObject =
        null;

      peerConnection =
        null;

      localStream =
        null;

      currentCallId =
        null;

      callButton.disabled =
        false;

    }

  </script>

</body>
</html>
