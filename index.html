<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Call</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    #status {
      margin: 20px auto;
      padding: 15px;
      width: 85%;
      max-width: 500px;
      background: #222;
      border-radius: 12px;
    }

    button {
      padding: 16px 40px;
      font-size: 20px;
      border: 0;
      border-radius: 12px;
      background: #00aaff;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    .video-box {
      width: 90%;
      max-width: 600px;
      margin: 20px auto;
    }

    video {
      width: 100%;
      background: black;
      border-radius: 12px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>HOME CALL</h1>

  <div id="status">Menghubungkan ke Firebase...</div>

  <button id="callButton" disabled>PANGGIL</button>

  <div class="video-box">
    <h3>Kamera Saya</h3>
    <video id="localVideo" autoplay muted playsinline></video>

    <h3>Kamera Penerima</h3>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      onSnapshot,
      updateDoc,
      arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyDyAki8b-cgy8UKD7lOJzYA-rvLXqHOmUw",
      authDomain: "home-call-947c8.firebaseapp.com",
      projectId: "home-call-947c8",
      storageBucket: "home-call-947c8.firebasestorage.app",
      messagingSenderId: "1070052309799",
      appId: "1:1070052309799:web:e35fff55d6c8b6625cc702",
      measurementId: "G-3CH3K7SKGP"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    // =========================
    // ELEMENT
    // =========================

    const status =
      document.getElementById("status");

    const callButton =
      document.getElementById("callButton");

    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");


    let user = null;
    let peer = null;
    let stream = null;
    let callId = null;


    // =========================
    // WEBRTC
    // =========================

    const rtcConfig = {
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        },
        {
          urls: "stun:stun1.l.google.com:19302"
        }
      ]
    };


    // =========================
    // FIREBASE LOGIN
    // =========================

    signInAnonymously(auth)
      .then(() => {

        console.log("Firebase login berhasil");

      })
      .catch((error) => {

        console.error(error);

        status.textContent =
          "Firebase gagal: " + error.message;

      });


    onAuthStateChanged(auth, (firebaseUser) => {

      if (!firebaseUser) return;

      user = firebaseUser;

      status.textContent =
        "Firebase terhubung. Siap melakukan panggilan";

      callButton.disabled = false;

      console.log(
        "User:",
        user.uid
      );

    });


    // =========================
    // TOMBOL PANGGIL
    // =========================

    callButton.addEventListener(
      "click",
      mulaiPanggilan
    );


    async function mulaiPanggilan() {

      try {

        callButton.disabled = true;

        status.textContent =
          "Meminta izin kamera dan mikrofon...";


        // =========================
        // KAMERA + MICROPHONE
        // =========================

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: true,
            audio: true

          });


        localVideo.srcObject = stream;


        status.textContent =
          "Kamera aktif. Membuat panggilan...";


        // =========================
        // WEBRTC
        // =========================

        peer =
          new RTCPeerConnection(rtcConfig);


        stream.getTracks().forEach(
          (track) => {

            peer.addTrack(
              track,
              stream
            );

          }
        );


        // =========================
        // VIDEO PENERIMA
        // =========================

        peer.ontrack = (event) => {

          if (
            event.streams &&
            event.streams[0]
          ) {

            remoteVideo.srcObject =
              event.streams[0];

            status.textContent =
              "TERHUBUNG";

          }

        };


        // =========================
        // BUAT OFFER
        // =========================

        const offer =
          await peer.createOffer();

        await peer.setLocalDescription(
          offer
        );


        // =========================
        // BUAT CALL DI FIRESTORE
        // =========================

        const callRef =
          await addDoc(
            collection(db, "calls"),
            {

              callerId: user.uid,

              status: "menunggu",

              createdAtMs: Date.now(),

              offer: {
                type: offer.type,
                sdp: offer.sdp
              },

              answer: null,

              callerCandidates: [],

              receiverCandidates: []

            }
          );


        callId = callRef.id;


        status.textContent =
          "Panggilan dibuat. Menunggu penerima...";


        // =========================
        // ICE CALLER
        // =========================

        peer.onicecandidate =
          async (event) => {

            if (!event.candidate)
              return;

            await updateDoc(
              doc(
                db,
                "calls",
                callId
              ),
              {

                callerCandidates:
                  arrayUnion(
                    event.candidate.toJSON()
                  )

              }
            );

          };


        // =========================
        // MENUNGGU ANSWER
        // =========================

        onSnapshot(
          doc(
            db,
            "calls",
            callId
          ),

          async (snapshot) => {

            const data =
              snapshot.data();

            if (!data) return;


            if (
              data.answer &&
              !peer.currentRemoteDescription
            ) {

              await peer.setRemoteDescription(

                new RTCSessionDescription(
                  data.answer
                )

              );

              status.textContent =
                "Penerima menjawab. Menghubungkan...";

            }


            // =========================
            // ICE PENERIMA
            // =========================

            if (
              data.receiverCandidates
            ) {

              for (
                const candidate
                of data.receiverCandidates
              ) {

                try {

                  await peer.addIceCandidate(
                    new RTCIceCandidate(
                      candidate
                    )
                  );

                } catch (error) {

                  console.log(
                    "ICE belum siap"
                  );

                }

              }

            }

          }
        );


      } catch (error) {

        console.error(error);

        callButton.disabled = false;

        status.textContent =
          "Gagal: " + error.message;

      }

    }

  </script>

</body>
</html>
