<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW CALL</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;

    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      margin-top: 30px;
    }

    #status {
      margin: 25px 0;

      font-size: 20px;
      background: #16c784;
      color: white;
      cursor: pointer;
    }

    button:disabled {

    }

    video {

      border-radius: 15px;
      background: black;
    }

    #videoArea {

<body>
