<html lang="id">

      padding: 15px 35px;

      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    .videos {
      width: 95%;
      max-width: 600px;
      margin: 20px auto;

    video {

<body>

  <div id="status">Siap melakukan panggilan</div>

  <button id="callButton">PANGGIL</button>

  <div class="videos">
    <h3>Kamera Saya</h3>
    <video id="localVideo" autoplay muted playsinline></video>

    <h3>Kamera Penerima</h3>
    <video id="remoteVideo" autoplay playsinline></video>

    const callButton = document.getElementById("callButton");
    const statusText = document.getElementById("status");

    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");


    let currentUser = null;
    let peerConnection = null;
    let localStream = null;
    let currentCallId = null;


    // ==============================

        },
        {

        }
      ]
    };


    // ==============================
    // LOGIN ANONIM
    // ==============================

    signInAnonymously(auth)
      .catch((error) => {
        console.error(error);
        statusText.textContent = "Gagal masuk Firebase";
      });


    onAuthStateChanged(auth, (user) => {

      if (user) {

        currentUser = user;

        statusText.textContent = "Siap melakukan panggilan";

        console.log("User ID:", user.uid);

    // TOMBOL PANGGIL

      if (!currentUser) {
        statusText.textContent = "Firebase belum siap...";
        return;
      }

        callButton.disabled = true;

        statusText.textContent = "Menyalakan kamera...";

        // ==============================
        // AKSES KAMERA DAN MICROPHONE
        // ==============================

        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        localVideo.srcObject = localStream;


        // ==============================
        // PEER CONNECTION
        // ==============================

        peerConnection = new RTCPeerConnection(configuration);


        // Tambahkan kamera + microphone
        localStream.getTracks().forEach((track) => {

          peerConnection.addTrack(
            track,
            localStream
          );

        });


        // ==============================
        // VIDEO DARI PENERIMA
        // ==============================

          console.log("Menerima video dari penerima");

          if (event.streams && event.streams[0]) {

            remoteVideo.srcObject = event.streams[0];

            statusText.textContent = "TERHUBUNG";

          }

        };

        // BUAT CALL
