<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Call - Receiver</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 10px;
    }

    #status {
      margin: 20px auto;
      padding: 12px;
      max-width: 500px;
      background: #222;
      border-radius: 10px;
    }

    .call-box {
      max-width: 600px;
      margin: auto;
    }

    .call-item {
      background: #222;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    button {
      padding: 14px 25px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #acceptButton {
      background: #00aa55;
      color: white;
    }

    #rejectButton {
      background: #cc2222;
      color: white;
    }

    video {
      width: 100%;
      max-width: 600px;
      margin-top: 15px;
      background: black;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>HOME CALL</h1>

  <div id="status">
    Menunggu panggilan...
  </div>

  <div class="call-box">

    <div class="call-item">

      <h2>Panggilan Masuk</h2>

      <button id="acceptButton">
        TERIMA
      </button>

      <button id="rejectButton">
        TOLAK
      </button>

    </div>

    <h3>Kamera Saya</h3>
    <video id="localVideo" autoplay muted playsinline></video>

    <h3>Kamera Pemanggil</h3>
    <video id="remoteVideo" autoplay playsinline></video>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      onSnapshot,
      doc,
      updateDoc,
      arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    // ==================================
    // FIREBASE
    // ==================================

    const firebaseConfig = {
      apiKey: "AIzaSyDyAki8b-cgy8UKD7lOJzYA-rvLXqHOmUw",
      authDomain: "home-call-947c8.firebaseapp.com",
      projectId: "home-call-947c8",
      storageBucket: "home-call-947c8.firebasestorage.app",
      messagingSenderId: "1070052309799",
      appId: "1:1070052309799:web:e35fff55d6c8b6625cc702",
      measurementId: "G-3CH3K7SKGP"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    // ==================================
    // ELEMENT
    // ==================================

    const statusText =
      document.getElementById("status");

    const acceptButton =
      document.getElementById("acceptButton");

    const rejectButton =
      document.getElementById("rejectButton");

    const localVideo =
      document.getElementById("localVideo");

    const remoteVideo =
      document.getElementById("remoteVideo");


    // ==================================
    // VARIABLE
    // ==================================

    let currentUser = null;

    let currentCallId = null;

    let currentCallData = null;

    let peerConnection = null;

    let localStream = null;

    let callerCandidateIds = new Set();


    // ==================================
    // WEBRTC
    // ==================================

    const configuration = {

      iceServers: [

        {
          urls: "stun:stun.l.google.com:19302"
        },

        {
          urls: "stun:stun1.l.google.com:19302"
        }

      ]

    };


    // ==================================
    // LOGIN ANONIM
    // ==================================

    signInAnonymously(auth)
      .catch((error) => {

        console.error(error);

        statusText.textContent =
          "Gagal masuk Firebase";

      });


    onAuthStateChanged(auth, (user) => {

      if (!user) return;

      currentUser = user;

      statusText.textContent =
        "Menunggu panggilan...";

      mulaiMencariPanggilan();

    });


    // ==================================
    // MENCARI PANGGILAN
    // ==================================

    function mulaiMencariPanggilan() {

      const callsRef =
        collection(db, "calls");

      const q = query(callsRef);


      onSnapshot(q, (snapshot) => {

        let panggilanTerbaru = null;

        let waktuTerbaru = 0;


        snapshot.forEach((item) => {

          const data = item.data();


          if (
            data.status === "menunggu" &&
            data.offer &&
            data.offer.type &&
            data.offer.sdp
          ) {

            const waktu =
              data.createdAtMs || 0;


            if (waktu > waktuTerbaru) {

              waktuTerbaru = waktu;

              panggilanTerbaru = {

                id: item.id,

                data: data

              };

            }

          }

        });


        if (panggilanTerbaru) {

          currentCallId =
            panggilanTerbaru.id;

          currentCallData =
            panggilanTerbaru.data;


          statusText.textContent =
            "📞 ADA PANGGILAN MASUK";

        }

      });

    }


    // ==================================
    // TERIMA
    // ==================================

    acceptButton.addEventListener(
      "click",
      async () => {

        if (
          !currentCallId ||
          !currentCallData
        ) {

          statusText.textContent =
            "Tidak ada panggilan.";

          return;

        }


        try {

          acceptButton.disabled = true;

          rejectButton.disabled = true;


          statusText.textContent =
            "Menyalakan kamera...";


          // ==================================
          // KAMERA + MICROPHONE
          // ==================================

          localStream =
            await navigator.mediaDevices.getUserMedia({

              video: true,

              audio: true

            });


          localVideo.srcObject =
            localStream;


          // ==================================
          // PEER CONNECTION
          // ==================================

          peerConnection =
            new RTCPeerConnection(
              configuration
            );


          // Tambahkan kamera dan microphone

          localStream
            .getTracks()
            .forEach((track) => {

              peerConnection.addTrack(
                track,
                localStream
              );

            });


          // ==================================
          // VIDEO PEMANGGIL
          // ==================================

          peerConnection.ontrack =
            (event) => {

              console.log(
                "Video pemanggil diterima"
              );


              if (
                event.streams &&
                event.streams[0]
              ) {

                remoteVideo.srcObject =
                  event.streams[0];

                statusText.textContent =
                  "TERHUBUNG";

              }

            };


          // ==================================
          // TERIMA ICE CANDIDATE
          // ==================================

          peerConnection.onicecandidate =
            async (event) => {

              if (!event.candidate)
                return;


              try {

                await updateDoc(

                  doc(
                    db,
                    "calls",
                    currentCallId
                  ),

                  {

                    receiverCandidates:
                      arrayUnion(
                        event.candidate.toJSON()
                      )

                  }

                );

              } catch (error) {

                console.error(
                  "Gagal menyimpan candidate:",
                  error
                );

              }

            };


          // ==================================
          // OFFER PEMANGGIL
          // ==================================

          const offer =
            new RTCSessionDescription(
              currentCallData.offer
            );


          await peerConnection
            .setRemoteDescription(
              offer
            );


          // ==================================
          // BUAT ANSWER
          // ==================================

          const answer =
            await peerConnection
              .createAnswer();


          await peerConnection
            .setLocalDescription(
              answer
            );


          // ==================================
          // SIMPAN ANSWER
          // ==================================

          await updateDoc(

            doc(
              db,
              "calls",
              currentCallId
            ),

            {

              answer: {

                type: answer.type,

                sdp: answer.sdp

              },

              status: "terhubung"

            }

          );


          statusText.textContent =
            "Menghubungkan...";


          // ==================================
          // PANTAU CALL
          // ==================================

          onSnapshot(

            doc(
              db,
              "calls",
              currentCallId
            ),

            async (snapshot) => {

              const data =
                snapshot.data();

              if (!data) return;


              // ==============================
              // CALLER CANDIDATES
              // ==============================

              if (
                data.callerCandidates
              ) {

                for (
                  const candidateData
                  of data.callerCandidates
                ) {

                  const candidateKey =
                    JSON.stringify(
                      candidateData
                    );


                  if (
                    callerCandidateIds.has(
                      candidateKey
                    )
                  ) {

                    continue;

                  }


                  callerCandidateIds.add(
                    candidateKey
                  );


                  try {

                    await peerConnection
                      .addIceCandidate(

                        new RTCIceCandidate(
                          candidateData
                        )

                      );

                  } catch (error) {

                    console.log(
                      "ICE belum siap:",
                      error
                    );

                  }

                }

              }

            }

          );


        } catch (error) {

          console.error(error);


          acceptButton.disabled =
            false;

          rejectButton.disabled =
            false;


          statusText.textContent =
            "Gagal: " +
            error.message;

        }

      }
    );


    // ==================================
    // TOLAK
    // ==================================

    rejectButton.addEventListener(
      "click",
      async () => {

        if (!currentCallId) {

          statusText.textContent =
            "Tidak ada panggilan.";

          return;

        }


        try {

          await updateDoc(

            doc(
              db,
              "calls",
              currentCallId
            ),

            {

              status: "ditolak"

            }

          );


          statusText.textContent =
            "Panggilan ditolak.";


          currentCallId = null;

          currentCallData = null;


        } catch (error) {

          console.error(error);

        }

      }
    );

  </script>

</body>
  </html>
